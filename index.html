<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ADDR – Automated Drainage Debris Removal System</title>
  <meta name="description" content="Monitoring app for the ADDR automated drainage debris removal unit.">
  <meta name="theme-color" content="#24282D">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">
    <!-- The current screen is drawn here by js/app.js -->
    <div class="view" id="view"></div>

    <!-- Short message shown after a cleaning cycle -->
    <div class="toast" id="toast" role="status" hidden></div>

    <!-- Phone-style notification (e.g. "Drain 2 is obstructed"). Tap to open that drain. -->
    <button type="button" class="notice" id="notice" aria-live="assertive" hidden></button>

    <!-- Bottom tab bar (hidden on the sign-in screen) -->
    <nav class="tabbar" id="tabbar" aria-label="Main" hidden>
      <button type="button" class="tab" data-go="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
        <span>Drains</span>
      </button>
      <button type="button" class="tab" data-go="alerts" id="alerts-tab">
        <span class="tab-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="badge" id="alert-badge" aria-hidden="true" hidden></span>
        </span>
        <span>Alerts</span>
      </button>
      <button type="button" class="tab" data-go="log">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        <span>Log</span>
      </button>
      <button type="button" class="tab" data-go="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
